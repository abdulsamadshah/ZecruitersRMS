name: akshara_capital
description: "A new Flutter project."

publish_to: 'none'


version: 1.0.0+1

environment:
  sdk: '>=3.4.3 <4.0.0'


dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.2
  flutter_screenutil: ^5.5.4
  intl: ^0.19.0
  flutter_svg: ^2.0.9
  dio: ^5.3.0
  fluttertoast: ^8.1.2
  shared_preferences: ^2.0.15
  cached_network_image: ^3.3.0
  image_picker: ^1.1.2
  image_cropper: ^8.0.2
  get: ^4.6.6
  firebase_messaging: ^14.0.2
  firebase_core: ^2.1.0
  firebase_database:
  flutter_local_notifications: ^16.3.0
  pretty_dio_logger: ^1.3.1
  geolocator: ^10.0.1
  flutter_bloc: ^8.1.2
  location:
  flutter_image_compress: ^2.1.0
  skeletonizer: ^0.8.0
  share: ^2.0.1
  permission_handler: ^11.0.1
  liquid_pull_to_refresh: ^3.0.1
  go_router: ^14.2.7
  easy_stepper: ^0.8.3
  dropdown_search: ^5.0.6
  otp_autofill: ^3.0.2










dev_dependencies:
  #flutter packages pub run build_runner build
  build_runner: any

  flutter_gen_runner: ^5.7.0
  flutter_test:
    sdk: flutter


  flutter_lints: ^3.0.1


flutter:




  uses-material-design: true
  assets:
    - asset/images/
    - asset/svg/

  fonts:
    - family: InterBlack
      fonts:
        - asset: asset/fonts/Inter-Black.ttf

    - family: InterBold
      fonts:
        - asset: asset/fonts/Inter-Bold.ttf

    - family: InterExtraBold
      fonts:
        - asset: asset/fonts/Inter-ExtraBold.ttf

    - family: InterExtraLight
      fonts:
        - asset: asset/fonts/Inter-ExtraLight.ttf

    - family: InterLight
      fonts:
        - asset: asset/fonts/Inter-Light.ttf

    - family: InterMedium
      fonts:
        - asset: asset/fonts/Inter-Medium.ttf

    - family: InterRegular
      fonts:
        - asset: asset/fonts/Inter-Regular.ttf

    - family: InterSemiBold
      fonts:
        - asset: asset/fonts/Inter-SemiBold.ttf

    - family: InterThin
      fonts:
        - asset: asset/fonts/Inter-Thin.ttf