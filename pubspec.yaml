name: zecruiters_rms
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.4.3 <4.0.0'


dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.2
  flutter_screenutil: ^5.5.4
  intl: ^0.19.0
  flutter_svg: ^2.0.9
  dio: ^5.3.0
  fluttertoast: ^8.1.2
  shared_preferences: ^2.0.15
  cached_network_image: ^3.3.0
#  image_cropper: ^8.0.2
  get: ^4.6.6
  pretty_dio_logger: ^1.3.1
  flutter_bloc: ^8.1.2
  location:
  skeletonizer: ^0.8.0
  permission_handler: ^11.0.1
  go_router: ^14.2.7
  dropdown_search: ^5.0.6
  url_launcher: ^6.3.1
  font_awesome_flutter: ^10.4.0
#  flutter_phone_direct_caller: ^2.1.1
  phone_state: ^2.1.1
  path_provider: ^2.0.13
  flutter_widget_from_html: ^0.15.3
  google_nav_bar: ^5.0.7




dev_dependencies:
  #flutter packages pub run build_runner build
  build_runner: any

  flutter_gen_runner: ^5.7.0
  flutter_test:
    sdk: flutter


  flutter_lints: ^3.0.1


flutter:




  uses-material-design: true
  assets:
    - asset/images/
    - asset/svg/

  fonts:
    - family: InterBlack
      fonts:
        - asset: asset/fonts/Inter-Black.ttf

    - family: InterBold
      fonts:
        - asset: asset/fonts/Inter-Bold.ttf

    - family: InterExtraBold
      fonts:
        - asset: asset/fonts/Inter-ExtraBold.ttf

    - family: InterExtraLight
      fonts:
        - asset: asset/fonts/Inter-ExtraLight.ttf

    - family: InterLight
      fonts:
        - asset: asset/fonts/Inter-Light.ttf

    - family: InterMedium
      fonts:
        - asset: asset/fonts/Inter-Medium.ttf

    - family: InterRegular
      fonts:
        - asset: asset/fonts/Inter-Regular.ttf

    - family: InterSemiBold
      fonts:
        - asset: asset/fonts/Inter-SemiBold.ttf

    - family: InterThin
      fonts:
        - asset: asset/fonts/Inter-Thin.ttf